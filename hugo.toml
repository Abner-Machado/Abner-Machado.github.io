baseURL = "https://abner-machado.github.io/"
locale = "en-us"
title = "Abner Machado"
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]
summaryLength = 30

[params]
  description = "Field notes on agent engineering and staying independent of other people's platforms."
  author = "Abner Machado"
  github = "https://github.com/Abner-Machado"

[[params.nav]]
  name = "Writing"
  url = "/posts/"
[[params.nav]]
  name = "About"
  url = "/about/"
[[params.nav]]
  name = "GitHub"
  url = "https://github.com/Abner-Machado"
  external = true

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
  style = "github"
  lineNos = false
  tabWidth = 2
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
