<li>
  <a class="post-item reveal" href="{{ .RelPermalink }}">
    <time class="post-item__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006 · 01 · 02" }}</time>
    <h2 class="post-item__title">{{ .Title }}</h2>
    <p class="post-item__summary">{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 150 }}{{ end }}</p>
  </a>
</li>
